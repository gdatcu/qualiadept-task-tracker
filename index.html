<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <title>QA Task Tracker Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="navbar">
    <h1 id="logo">QA Task Tracker</h1>
    <span id="network-status" class="status-indicator online">API Online</span>
  </header>

  <main class="container">
    <section class="card input-section">
      <h2>Adaugă un Task Nou</h2>
      <form id="add-task-form">
        <div class="form-group">
          <label for="task-name">Nume Task:</label>
          <input type="text" id="task-name" placeholder="ex: Testare login" data-testid="input-task-name">
          <small id="error-msg" class="error-text" data-testid="error-message" style="display: none;">Numele task-ului nu poate fi gol!</small>
        </div>
        <button type="submit" id="submit-task-btn" data-testid="submit-task-btn" disabled>Salvează Task</button>
      </form>
    </section>

    <section class="card list-section">
      <h2>Task-uri Active</h2>
      <div id="loading-spinner" class="spinner" data-testid="loading-spinner">Se încarcă datele de la server...</div>
      <ul id="task-list" class="task-list" data-testid="task-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>

</html>
