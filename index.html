<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker Login</title>
</head>

<body>

  <div class="login-container">
    <form>
      <label for="login-email">Email:</label>
      <input
                type="email"
                id="login-email"
                data-testid="input-email"
                required
            >

      <label for="login-password">Parolă:</label>
      <input
                type="password"
                id="login-password"
                data-testid="input-password"
                required
            >

      <button type="submit" data-testid="btn-submit-login">
                Autentificare
            </button>
    </form>
  </div>

</body>

</html>
